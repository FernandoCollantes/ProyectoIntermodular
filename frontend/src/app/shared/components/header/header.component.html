<header class="barra-superior">
  <div class="info-izquierda">
    <h2 class="titulo-pagina">{{ titulo }}</h2>
    <span *ngIf="cycle" class="badge-ciclo" [class.dam]="cycle === 'DAM'" [class.daw]="cycle === 'DAW'">
      {{ cycle }}
    </span>
  </div>

  <div class="acciones-header">

    <!-- User Logged In -->
    <ng-container *ngIf="user; else notLoggedIn">
      <div class="user-info">
        <span class="user-name">{{ user.name }}</span>
        <button class="btn-switch" (click)="switchCycle.emit()" title="Cambiar de ciclo">
          🔁
        </button>
      </div>

      <div class="separador-vertical"></div>

      <button class="boton-perfil-header" (click)="logout.emit()">
        <span class="texto-salir">Cerrar Sesión</span>
        <div class="icono-salir"></div>
      </button>

      <div class="avatar-circle">
        {{ iniciales }}
      </div>
    </ng-container>

    <!-- User Logged Out -->
    <ng-template #notLoggedIn>
      <a routerLink="/auth/login" class="boton-perfil-header" style="text-decoration: none;">
        <span class="texto-salir" style="margin-right:0;">Acceso Profesor</span>
      </a>
    </ng-template>

  </div>
</header>
