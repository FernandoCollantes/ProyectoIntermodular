<div class="dialog-overlay" *ngIf="isVisible" (click)="onBackdropClick($event)">
    <div class="dialog-container" [class]="'dialog-' + data.type">
        <!-- Icon -->
        <div class="dialog-icon" [class]="'icon-' + data.type">
            <svg *ngIf="data.type === 'warning'" viewBox="0 0 24 24" fill="currentColor">
                <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z" />
            </svg>
            <svg *ngIf="data.type === 'danger'" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
            </svg>
            <svg *ngIf="data.type === 'info'" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
            </svg>
        </div>

        <!-- Content -->
        <div class="dialog-content">
            <h2 class="dialog-title">{{ data.title }}</h2>
            <p class="dialog-message">{{ data.message }}</p>
        </div>

        <!-- Actions -->
        <div class="dialog-actions">
            <button type="button" (click)="cancel()" class="dialog-button button-cancel">
                {{ data.cancelText }}
            </button>
            <button type="button" (click)="confirm()" class="dialog-button button-confirm"
                [class]="'confirm-' + data.type">
                {{ data.confirmText }}
            </button>
        </div>
    </div>
</div>
