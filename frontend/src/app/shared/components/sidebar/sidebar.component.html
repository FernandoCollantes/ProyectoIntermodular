<aside class="barra-lateral" [class.collapsed]="collapsed">
  <div class="barra-lateral-cabecera">
    <!-- Dynamic Logo Logic -->
    <div class="logo-container" *ngIf="!collapsed">
      <img src="assets/Logo1.png" alt="Campus Hub" class="logo-full">
    </div>

    <!-- Collapse Toggle Button -->
    <button class="btn-toggle-sidebar" (click)="toggle.emit()" [title]="collapsed ? 'Expandir' : 'Colapsar'">
      <svg *ngIf="collapsed" viewBox="0 0 24 24" class="icon-toggle">
        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="currentColor" />
      </svg>
      <svg *ngIf="!collapsed" viewBox="0 0 24 24" class="icon-toggle">
        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor" />
      </svg>
    </button>
  </div>

  <div class="nav-scrollable">
    <nav class="barra-lateral-navegacion">

      <a routerLink="/dashboard" routerLinkActive="activo" class="item-navegacion" title="INICIO">
        <div class="icono-custom tipo-texto">I</div>
        <span class="nav-text" *ngIf="!collapsed">INICIO</span>
      </a>

      <a routerLink="/preguntas" routerLinkActive="activo" [routerLinkActiveOptions]="{exact: true}"
        class="item-navegacion" title="Mis Preguntas">
        <div class="icono-custom tipo-texto">P</div>
        <span class="nav-text" *ngIf="!collapsed">Mis Preguntas</span>
      </a>

      <a routerLink="/examenes" routerLinkActive="activo" [routerLinkActiveOptions]="{exact: true}"
        class="item-navegacion" title="Mis Exámenes">
        <div class="icono-custom tipo-texto">E</div>
        <span class="nav-text" *ngIf="!collapsed">Mis Exámenes</span>
      </a>

      <a routerLink="/examenes/borradores" routerLinkActive="activo" class="item-navegacion" title="Borradores">
        <div class="icono-custom tipo-svg">
          <svg viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Borradores">
            <title>Borradores</title>
            <path
              d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
            <path d="M7 18h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z" opacity="0.5" />
          </svg>
        </div>
        <span class="nav-text" *ngIf="!collapsed">Borradores</span>
      </a>

      <a routerLink="/examenes/realizados" routerLinkActive="activo" class="item-navegacion"
        title="Exámenes Realizados">
        <div class="icono-custom tipo-svg">
          <svg viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Exámenes Realizados">
            <title>Exámenes Realizados</title>
            <path
              d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
          </svg>
        </div>
        <span class="nav-text" *ngIf="!collapsed">Realizados</span>
      </a>

      <a routerLink="/asignaturas" routerLinkActive="active-link" class="item-navegacion" title="Asignaturas">
        <div class="icono-custom tipo-texto">A</div>
        <span class="nav-text" *ngIf="!collapsed">Asignaturas</span>
      </a>

      <div class="separator"></div>

      <a routerLink="/preguntas/crear" routerLinkActive="activo" class="item-navegacion" title="Crear Pregunta">
        <div class="icono-custom tipo-texto">P+</div>
        <span class="nav-text" *ngIf="!collapsed">Crear Pregunta</span>
      </a>

      <a routerLink="/examenes/crear" routerLinkActive="activo" class="item-navegacion" title="Crear Examen">
        <div class="icono-custom tipo-texto">E+</div>
        <span class="nav-text" *ngIf="!collapsed">Crear Examen</span>
      </a>


    </nav>
  </div>

</aside>
