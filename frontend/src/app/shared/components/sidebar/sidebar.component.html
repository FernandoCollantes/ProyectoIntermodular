<aside class="barra-lateral">
  <div class="barra-lateral-cabecera">
    <h2>EXAMGEN</h2>
  </div>
  //ENLACES TEMPORALES A ZONA ALUMNO
  <div style="margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
  
  <small style="color: var(--gray-500); display: block; padding-left: 20px; margin-bottom: 10px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;">
    Zona Alumno (Temp)
  </small>

  <ul style="list-style: none; padding: 0; margin: 0;">
    <li>
      <a routerLink="/alumno/acceso" class="nav-link" style="display: flex; align-items: center; padding: 12px 20px; color: var(--gray-400); text-decoration: none; transition: all 0.2s;">
        <span style="margin-right: 12px; font-size: 1.1rem;">🔒</span>
        <span>Acceso Alumno</span>
      </a>
    </li>

    <li>
      <a routerLink="/alumno/realizar-examen" class="nav-link" style="display: flex; align-items: center; padding: 12px 20px; color: var(--gray-400); text-decoration: none; transition: all 0.2s;">
        <span style="margin-right: 12px; font-size: 1.1rem;">📝</span>
        <span>Realizar Examen</span>
      </a>
    </li>
  </ul>

</div>
  
  <nav class="barra-lateral-navegacion">
    
    <a routerLink="/dashboard" routerLinkActive="activo" class="item-navegacion">
      <div class="icono-navegacion"></div> <span>Dashboard</span>
    </a>

    <a routerLink="/preguntas" routerLinkActive="activo" [routerLinkActiveOptions]="{exact: true}" class="item-navegacion">
      <div class="icono-navegacion"></div> <span>Mis Preguntas</span>
    </a>

    <a routerLink="/examenes" routerLinkActive="activo" [routerLinkActiveOptions]="{exact: true}" class="item-navegacion">
      <div class="icono-navegacion"></div> <span>Mis Exámenes</span>
    </a>

    <a href="#" class="item-navegacion">
      <div class="icono-navegacion"></div> <span>Asignaturas</span>
    </a>

    <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 10px 20px;"></div>

    <a routerLink="/preguntas/crear" routerLinkActive="activo" class="item-navegacion">
      <div class="icono-navegacion"></div> <span>Crear Pregunta</span>
    </a>

    <a routerLink="/examenes/crear" routerLinkActive="activo" class="item-navegacion">
      <div class="icono-navegacion"></div> <span>Crear Examen</span>
    </a>

    <a routerLink="/examenes" class="item-navegacion">
      <div class="icono-navegacion"></div> <span>Exportar</span>
    </a>

  </nav>
</aside>
