<div class="contenedor-app">

  <app-sidebar [collapsed]="sidebarCollapsed" (toggle)="onToggleSidebar()"></app-sidebar>

  <main class="contenido-principal" [class.sidebar-collapsed]="sidebarCollapsed">

    <app-header [titulo]="getPageTitle()" [user]="user$ | async" [cycle]="cycle$ | async" (logout)="onLogout()"
      (switchCycle)="onSwitchCycle()">
    </app-header>

    <div class="contenido-interno">
      <router-outlet></router-outlet>
    </div>

  </main>
</div>
