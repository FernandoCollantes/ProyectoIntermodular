<div class="contenedor-asignaturas">
  <header class="cabecera-seccion">
    <h2>Módulos y Resultados de Aprendizaje</h2>
    <p>Información extraída del archivo oficial DAMyDAW.xml</p>
  </header>

  <div *ngIf="cargando" class="cargando">
    <p>Cargando datos del currículo...</p>
  </div>

  <div class="rejilla-modulos" *ngIf="!cargando">
    <div class="tarjeta-modulo" *ngFor="let modulo of modulos">
      <div class="modulo-info">
        <h3>{{ modulo.nombre }}</h3>
        <span class="conteo-ra">{{ modulo.ras.length }} RAs disponibles</span>
      </div>

      <ul class="lista-ras">
        <li *ngFor="let ra of modulo.ras">
          <strong>{{ ra.codigo }}:</strong> {{ ra.texto }}
        </li>
      </ul>
    </div>
  </div>

  <div *ngIf="!cargando && modulos.length === 0" class="sin-datos">
    <p>No se han encontrado módulos en el archivo XML.</p>
  </div>
</div>
