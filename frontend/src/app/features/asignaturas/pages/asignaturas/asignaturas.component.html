<div class="contenedor-asignaturas">
  <div class="cabecera-pagina">
    <h1>Mis Asignaturas</h1>
    <p>Consulta los módulos profesionales y sus Resultados de Aprendizaje (1er Curso DAW/DAM).</p>
  </div>

  <div *ngIf="cargando" class="loader">
    <div class="spinner"></div>
    <p>Cargando mapa académico...</p>
  </div>

  <div class="grid-asignaturas" *ngIf="!cargando">
    <div class="card-modulo" *ngFor="let modulo of modulos" [class.active]="moduloAbiertoId === modulo._id">
      
      <div class="card-header" (click)="toggleModulo(modulo._id)">
        <div class="header-content">
          <span class="id-tag">{{ modulo._id }}</span>
          <h2 class="titulo-modulo">{{ modulo.nombre }}</h2>
        </div>
        <span class="chevron" [class.rotated]="moduloAbiertoId === modulo._id">▼</span>
      </div>

      <div class="card-body" *ngIf="moduloAbiertoId === modulo._id">
        <div class="ra-seccion">
          <h3>Resultados de Aprendizaje</h3>
          <div class="ra-item" *ngFor="let ra of modulo.resultados_aprendizaje">
            <div class="ra-badge">RA {{ ra.codigo }}</div>
            <div class="ra-texto">{{ ra.nombre }}</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
