<div class="tarjeta">
  <form>
    <h3 style="margin-bottom: var(--spacing-lg); color: var(--text-primary)">
      Configuración del Examen
    </h3>

    <div class="grupo-formulario">
      <label for="examTitle" class="etiqueta-formulario requerido">Título del examen</label>
      <input
        type="text"
        id="examTitle"
        class="entrada-formulario"
        placeholder="Ej: Examen Final Matemáticas - 1º Trimestre"
      />
    </div>

    <div class="rejilla-configuracion-examen">
      <div class="grupo-formulario">
        <label for="subject" class="etiqueta-formulario requerido">Asignatura</label>
        <select id="subject" class="seleccion-formulario">
          <option value="">Seleccionar...</option>
          <option value="IPE">IPE</option>
          <option value="LENGUAJE DE MARCAS">LENGUAJE DE MARCAS</option>
          <option value="PROGRAMACIÓN">PROGRAMACIÓN</option>
          <option value="INGLÉS">INGLÉS</option>
        </select>
      </div>

      <div class="grupo-formulario">
        <label for="duration" class="etiqueta-formulario requerido">Duración (minutos)</label>
        <input
          type="number"
          id="duration"
          class="entrada-formulario"
          placeholder="60"
          min="5"
          max="180"
        />
      </div>

      <div class="grupo-formulario">
        <label for="passingGrade" class="etiqueta-formulario requerido">Nota mínima (%)</label>
        <input
          type="number"
          id="passingGrade"
          class="entrada-formulario"
          placeholder="50"
          min="0"
          max="100"
        />
      </div>

      <div class="grupo-formulario">
        <label for="attempts" class="etiqueta-formulario">Intentos permitidos</label>
        <select id="attempts" class="seleccion-formulario">
          <option value="1" selected>1 intento</option>
          <option value="2">2 intentos</option>
          <option value="3">3 intentos</option>
          <option value="unlimited">Ilimitados</option>
        </select>
      </div>
    </div>

    <div class="seleccion-preguntas">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: var(--spacing-lg);
        "
      >
        <h3 style="margin: 0; color: var(--text-primary)">Seleccionar Preguntas</h3>
        <span class="contador-seleccionado">
          <div
            style="width: 16px; height: 16px; background-color: var(--primary); border-radius: 50%"
          ></div>
          3 preguntas seleccionadas
        </span>
      </div>

      <div class="barra-busqueda" style="margin-bottom: var(--spacing-md)">
        <div class="icono-busqueda"></div>
        <input type="text" class="entrada-busqueda" placeholder="Buscar preguntas..." />
      </div>

      <div class="lista-preguntas">
        <label class="item-seleccion-pregunta">
          <input type="checkbox" checked />
          <div class="contenido-seleccion-pregunta">
            <div class="texto-seleccion-pregunta">
              ¿Cuál es la solución de la ecuación 2x + 5 = 13?
            </div>
            <div class="meta-seleccion-pregunta">
              <span class="insignia insignia-primaria">MAT</span>
              <span class="insignia">ÁLGEBRA</span>
              <span class="insignia">MEDIA</span>
            </div>
          </div>
        </label>

        <label class="item-seleccion-pregunta">
          <input type="checkbox" checked />
          <div class="contenido-seleccion-pregunta">
            <div class="texto-seleccion-pregunta">
              ¿Cuál es el área de un círculo con radio de 5 cm?
            </div>
            <div class="meta-seleccion-pregunta">
              <span class="insignia insignia-primaria">MAT</span>
              <span class="insignia">GEOMETRÍA</span>
              <span class="insignia">FÁCIL</span>
            </div>
          </div>
        </label>
      </div>
    </div>

    <div class="grupo-formulario">
      <label class="etiqueta-formulario">Opciones de configuración</label>

      <div class="contenedor-opciones-adicionales">
        <label class="item-opcion">
          <input type="checkbox" name="aleatorio" />
          <span>Mezclar preguntas aleatoriamente</span>
        </label>

        <label class="item-opcion">
          <input type="checkbox" name="respuestas_inmediatas" />
          <span>Mostrar respuestas al finalizar</span>
        </label>

        <label class="item-opcion">
          <input type="checkbox" name="limite_tiempo" checked />
          <span>Habilitar límite de tiempo</span>
        </label>

        <label class="item-opcion">
          <input type="checkbox" name="navegacion_libre" />
          <span>Permitir volver atrás</span>
        </label>
      </div>
    </div>

    <div class="acciones-formulario">
      <a [routerLink]="['/dashboard']" class="boton boton-contorno">Cancelar</a>
      <button type="button" class="boton boton-secundario">Guardar como borrador</button>
      <button type="submit" class="boton boton-primario">
        <div class="boton-icono"></div>
        Crear y Publicar Examen
      </button>
    </div>
  </form>
</div>
