<div class="tarjeta">
  <div class="tarjeta-cabecera">
    <h1>Crear Nueva Pregunta</h1>
  </div>

  <form [formGroup]="preguntaForm" (ngSubmit)="onSubmit()">
    
    <div class="grupo-formulario">
      <label class="etiqueta-formulario requerido">Título / Ciclo Formativo</label>
      <select class="seleccion-formulario" formControlName="titulo">
        <option value="" disabled>Selecciona el ciclo...</option>
        <option *ngFor="let curso of cursos" [value]="curso._id">{{ curso.nombre }}</option>
      </select>
    </div>

    <div class="grupo-formulario">
      <label class="etiqueta-formulario requerido">Asignatura (Módulo)</label>
      <select class="seleccion-formulario" formControlName="asignatura">
        <option value="" disabled>Selecciona una asignatura...</option>
        <option *ngFor="let asig of asignaturasDisponibles" [value]="asig._id">{{ asig.nombre }}</option>
      </select>
      <div *ngIf="preguntaForm.get('asignatura')?.invalid && preguntaForm.get('asignatura')?.touched"
        style="color: #e74c3c; font-size: 0.85rem; margin-top: 5px;">Campo obligatorio</div>
    </div>

    <div class="grupo-formulario">
      <label class="etiqueta-formulario requerido">Resultado de Aprendizaje (RA)</label>
      <select class="seleccion-formulario" formControlName="ra">
        <option value="" disabled>Selecciona el RA...</option>
        <option *ngFor="let ra of rasDisponibles" [value]="ra.codigo">
          RA{{ ra.codigo }}: {{ ra.nombre }}
        </option>
      </select>
    </div>

    <div class="grupo-formulario" *ngIf="criteriosDisponibles.length > 0">
      <label class="etiqueta-formulario requerido">Criterio de Evaluación</label>
      <div style="font-size: 0.9rem; color: #666; margin-bottom: 5px;">
        Seleccione los criterios que abarcará la pregunta (Ctrl + Click)
      </div>
      <select class="seleccion-formulario" formControlName="criterios" multiple style="min-height: 120px;">
        <option *ngFor="let crit of criteriosDisponibles" [value]="crit.codigo">
          ({{ crit.codigo }}) {{ crit.nombre }}
        </option>
      </select>
    </div>

    <div class="grupo-formulario">
      <label class="etiqueta-formulario requerido">Enunciado de la pregunta</label>
      <textarea class="entrada-formulario" formControlName="enunciado" rows="4"
        placeholder="Escribe el enunciado completo de la pregunta..."></textarea>
      <div *ngIf="preguntaForm.get('enunciado')?.invalid && preguntaForm.get('enunciado')?.touched"
        style="color: #e74c3c; font-size: 0.85rem; margin-top: 5px;">Campo obligatorio</div>
    </div>

    <div class="grupo-formulario">
      <label class="etiqueta-formulario requerido">Opciones de respuesta</label>
      <div class="contenedor-opciones-respuesta">
        
        <div class="entrada-opcion-respuesta" *ngFor="let letra of ['A', 'B', 'C', 'D']">
          <input type="radio" formControlName="respuestaCorrecta" [value]="letra.toLowerCase()">
          <label style="font-weight: 600; min-width: 20px;">{{ letra }})</label>
          <input type="text" class="entrada-formulario" [formControlName]="'opcion' + letra" 
            [placeholder]="'Escribe la opción ' + letra">
        </div>

        <div *ngIf="preguntaForm.hasError('duplicateOptions') && preguntaForm.touched"
          style="color: #e74c3c; font-size: 0.85rem; margin-top: 5px; font-weight: bold;">
          No pueden haber opciones repetidas (verifica que el texto es distinto en cada una).
        </div>
      </div>
    </div>

    <div class="grupo-formulario">
      <label class="etiqueta-formulario requerido">Nivel de dificultad</label>
      <select class="seleccion-formulario" formControlName="dificultad">
        <option value="facil">Fácil</option>
        <option value="media">Media</option>
        <option value="dificil">Difícil</option>
      </select>
    </div>

    <div class="acciones-formulario">
      <a [routerLink]="['/preguntas']" class="boton boton-contorno">Cancelar</a>
      <button type="submit" class="boton boton-primario" [disabled]="preguntaForm.invalid">
        Guardar Pregunta
      </button>
    </div>

  </form>
</div>
