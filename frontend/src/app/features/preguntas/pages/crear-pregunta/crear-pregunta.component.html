<div class="tarjeta">
  <div class="tarjeta-cabecera">
    <h2 class="tarjeta-titulo">Crear Nueva Pregunta</h2>
  </div>

  <form>
    <div class="grupo-formulario">
      <label class="etiqueta-formulario">Asignatura</label>
      <select class="seleccion-formulario">
        <option value="" disabled selected>Selecciona una asignatura...</option>
        <option value="matematicas">Matemáticas</option>
        <option value="historia">Historia</option>
        <option value="ciencias">Ciencias</option>
      </select>
    </div>

    <div class="grupo-formulario">
      <label class="etiqueta-formulario">Enunciado de la pregunta</label>
      
      <div class="contenedor-editor">
        <div class="barra-herramientas-editor">
          <button type="button" class="boton-herramienta" title="Negrita"><b>B</b></button>
          <button type="button" class="boton-herramienta" title="Cursiva"><i>I</i></button>
          <button type="button" class="boton-herramienta" title="Subrayado"><u>U</u></button>
          
          <div class="separador-herramientas"></div>
          
          <button type="button" class="boton-herramienta" title="Lista con viñetas">•</button>
          <button type="button" class="boton-herramienta" title="Lista numerada">1.</button>
        </div>
        
        <textarea class="area-texto-editor" placeholder="Escribe tu pregunta aquí..."></textarea>
      </div>
    </div>

    <div class="grupo-formulario">
      <label class="etiqueta-formulario">Opciones de respuesta</label>
      
      <div class="contenedor-opciones-respuesta">
        
        <div class="entrada-opcion-respuesta">
          <input type="radio" name="correctAnswer" value="a" checked>
          <label style="font-weight: 600; min-width: 20px;">A)</label>
          <input type="text" class="entrada-formulario" placeholder="Escribe la opción A">
        </div>

        <div class="entrada-opcion-respuesta">
          <input type="radio" name="correctAnswer" value="b">
          <label style="font-weight: 600; min-width: 20px;">B)</label>
          <input type="text" class="entrada-formulario" placeholder="Escribe la opción B">
        </div>

        <div class="entrada-opcion-respuesta">
          <input type="radio" name="correctAnswer" value="c">
          <label style="font-weight: 600; min-width: 20px;">C)</label>
          <input type="text" class="entrada-formulario" placeholder="Escribe la opción C">
        </div>

        <div class="entrada-opcion-respuesta">
          <input type="radio" name="correctAnswer" value="d">
          <label style="font-weight: 600; min-width: 20px;">D)</label>
          <input type="text" class="entrada-formulario" placeholder="Escribe la opción D">
        </div>

      </div>
    </div>

    <div class="grupo-formulario">
      <label class="etiqueta-formulario">Nivel de dificultad</label>
      <select class="seleccion-formulario">
        <option value="facil">Fácil</option>
        <option value="media" selected>Media</option>
        <option value="dificil">Difícil</option>
      </select>
    </div>

    <div class="acciones-formulario">
      <a [routerLink]="['/preguntas']" class="boton boton-contorno">
        Cancelar
      </a>
      <button type="submit" class="boton boton-primario">
        <div class="boton-icono"></div> 
        Guardar Pregunta
      </button>
    </div>

  </form>
</div>
