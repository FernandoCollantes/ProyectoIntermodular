<div class="contenedor-crear">
  <h2>Crear Nueva Pregunta</h2>

  <form (ngSubmit)="guardar()" #preguntaForm="ngForm">
    
    <div class="campo">
      <label>Módulo:</label>
      <select name="asignatura" [(ngModel)]="nuevaPregunta.asignatura" (change)="onModuloChange()" required>
        <option value="" disabled selected>Selecciona un módulo...</option>
        <option *ngFor="let m of modulos" [value]="m.nombre">{{ m.nombre }}</option>
      </select>
    </div>

    <div class="campo">
      <label>Resultado de Aprendizaje (RA):</label>
      <select name="tema" [(ngModel)]="nuevaPregunta.tema" [disabled]="!rasDisponibles.length" required>
        <option value="" disabled selected>Selecciona un RA...</option>
        <option *ngFor="let ra of rasDisponibles" [value]="ra.codigo">
          {{ ra.codigo }}: {{ ra.texto | slice:0:80 }}...
        </option>
      </select>
    </div>

    <div class="campo">
      <label>Enunciado de la pregunta:</label>
      <textarea name="enunciado" [(ngModel)]="nuevaPregunta.enunciado" required placeholder="Escribe aquí la pregunta..."></textarea>
    </div>

    <div class="campo">
      <label>Dificultad:</label>
      <div class="grupo-radio">
        <label><input type="radio" name="difi" [(ngModel)]="nuevaPregunta.dificultad" [value]="0"> Fácil</label>
        <label><input type="radio" name="difi" [(ngModel)]="nuevaPregunta.dificultad" [value]="1"> Media</label>
        <label><input type="radio" name="difi" [(ngModel)]="nuevaPregunta.dificultad" [value]="2"> Difícil</label>
      </div>
    </div>

    <div class="seccion-opciones">
  <div class="campo-opcion" *ngFor="let opt of nuevaPregunta.opciones; let i = index">
    <label>Opción {{ i + 1 }}:</label>
    <div class="entrada-opcion">
      <input type="text" [name]="'opt' + i" [(ngModel)]="nuevaPregunta.opciones[i]" required>
      
      <label class="radio-correcta">
        <input type="radio" 
               name="correcta" 
               [value]="String(i)" 
               [(ngModel)]="nuevaPregunta.respuesta_correcta">
        Es la correcta
      </label>
    </div>
  </div>
</div>

    <div class="acciones">
      <button type="button" (click)="router.navigate(['/preguntas/mis-preguntas'])" class="boton-secundario">
        Cancelar
      </button>
      <button type="submit" class="boton-primario" [disabled]="!preguntaForm.valid">
        Guardar Pregunta
      </button>
    </div>

  </form>
</div>
